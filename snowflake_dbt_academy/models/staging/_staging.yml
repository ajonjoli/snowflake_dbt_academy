version: 2

models:
  - name: stg_customers
    description: Cleaned and deduplicated customers. One row per unique email, keeping the most recent record
    columns:
      - name: customer_id
        description: primary key
        tests:
          - unique
          - not_null
      - name: email
        description: lowercased, trimmed email address
        tests:
          - unique
          - not_null
      - name: country_standardized
        description: standardized countr code via seed mapping

  - name: stg_orders
    description: orders with standardized status values
    columns:
      - name: order_id
        description: "{{ doc('order_id') }}"
        tests:
          - unique
          - not_null
      - name: customer_id
        description: foreign key to customers
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_customers')
                field: customer_id
      - name: order_status
        description: standardized order status values
        tests:
          - accepted_values:
              arguments:
                values: ['completed', 'in_transit', 'open', 'cancelled', 'other']

