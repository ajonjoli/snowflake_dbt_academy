version: 2

sources:
  - name: raw_data
    database: raw
    schema: public
    config:
      loaded_at_field: _loaded_at
      freshness:
        warn_after: {count: 24, period: hour}
        error_after: {count: 48, period: hour}
    tables:
      - name: customers
        config:
          loaded_at_field: created_at
      - name: line_items
        config:
          freshness: null
      - name: orders
        config:
          loaded_at_field: order_date
          freshness:
            warn_after: {count: 12, period: hour}
            error_after: {count: 24, period: hour}
      - name: payments
        config:
          freshness: null
      - name: products
        config:
          freshness: null
      - name: web_events
        config:
          loaded_at_field: received_at

